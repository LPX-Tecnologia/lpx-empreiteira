<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo – LPX Empreiteira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="assets/logo.svg" alt="LPX" class="logo-img">
                <span class="ms-2">Painel Administrativo</span>
            </a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4">Bem-vindo, Empreiteiro!</h2>

        <!-- Abas -->
        <ul class="nav nav-tabs" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="orcamentos-tab" data-bs-toggle="tab" data-bs-target="#orcamentos" type="button" role="tab">Orçamentos</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="candidaturas-tab" data-bs-toggle="tab" data-bs-target="#candidaturas" type="button" role="tab">Candidaturas</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="contatos-tab" data-bs-toggle="tab" data-bs-target="#contatos" type="button" role="tab">Mensagens</button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">
            <!-- Orçamentos -->
            <div class="tab-pane fade show active" id="orcamentos" role="tabpanel">
                <div class="card mt-3">
                    <div class="card-header bg-primary text-white">
                        <i class="fas fa-file-invoice"></i> Solicitações de Orçamento
                    </div>
                    <div class="card-body">
                        <div id="listaOrcamentos" class="table-responsive">
                            <!-- Preenchido via JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Candidaturas -->
            <div class="tab-pane fade" id="candidaturas" role="tabpanel">
                <div class="card mt-3">
                    <div class="card-header bg-success text-white">
                        <i class="fas fa-users"></i> Candidaturas Recebidas
                    </div>
                    <div class="card-body">
                        <div id="listaCandidaturas" class="table-responsive">
                            <!-- Preenchido via JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contatos -->
            <div class="tab-pane fade" id="contatos" role="tabpanel">
                <div class="card mt-3">
                    <div class="card-header bg-info text-white">
                        <i class="fas fa-envelope"></i> Mensagens de Contato
                    </div>
                    <div class="card-body">
                        <div id="listaContatos" class="table-responsive">
                            <!-- Preenchido via JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
